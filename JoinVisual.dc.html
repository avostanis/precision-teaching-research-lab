<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{ wrapRef }}" style="width:100%">
  <svg role="img" aria-label="Two rising lines, one for the lab and one for you, meet in the middle and carry on together as a single, steeper line." width="100%" height="{{ h }}" style="display:block;overflow:visible">
    <line x1="0" y1="{{ a0 }}" x2="{{ mx }}" y2="{{ my }}" stroke="#00376D" stroke-width="1.5"></line>
    <line x1="0" y1="{{ b0 }}" x2="{{ mx }}" y2="{{ my }}" stroke="#0B0C0E" stroke-width="1.5"></line>
    <line x1="{{ mx }}" y1="{{ my }}" x2="{{ w }}" y2="{{ y1 }}" stroke="#00376D" stroke-width="2.5"></line>
    <circle cx="0" cy="{{ a0 }}" r="3.5" fill="#00376D"></circle>
    <circle cx="0" cy="{{ b0 }}" r="3.5" fill="#0B0C0E"></circle>
    <circle cx="{{ w }}" cy="{{ y1 }}" r="5" fill="#00376D"></circle>
    <text x="10" y="{{ labA }}" style="font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;fill:#00376D">The lab</text>
    <text x="10" y="{{ labB }}" style="font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;fill:#0B0C0E">You</text>
    <text x="{{ labTx }}" y="{{ labTy }}" style="font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;fill:#00376D">Together</text>
    <sc-for list="{{ figs }}" as="f" hint-placeholder-count="0">
      <g transform="{{ f.tf }}">
        <circle cx="{{ f.ax }}" cy="{{ f.ay }}" r="{{ f.ar }}" fill="{{ f.c }}"></circle>
        <path d="{{ f.d }}" stroke="{{ f.c }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
        <path d="{{ f.x }}" stroke="{{ f.c }}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
        <circle cx="{{ f.hx }}" cy="-26" r="4" fill="{{ f.c }}"></circle>
      </g>
    </sc-for>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;240px&quot;}}">
// The "Join or collaborate" picture: two rising lines, the lab's and yours, meet and carry on
// together as one steeper line. Figures are drawn as on the other pages, from the feet (0,0) upwards.
const NAVY = '#00376D', INK = '#0B0C0E';
const LEGS = 'M-4 0L0 -10L4 0M0 -10V-21', WALK = 'M-5 0L0 -10L4 -4L6 0M0 -10V-21';
const SEAT = 'M-7 -7a7 7 0 1 0 14 0a7 7 0 1 0 -14 0M-3 -10V-21M-3 -11H6V-4';
const POSE = {
  walk: WALK + 'M-5 -13L0 -18L6 -15',
  hands: LEGS + 'M-10 -15L0 -18L10 -15',
  reach: LEGS + 'M-5 -12L0 -18L9 -15',
  hold: LEGS + 'M-5 -12L0 -18L6 -14',
  point: LEGS + 'M-5 -12L0 -18L11 -24',
  chairHold: SEAT + 'M-3 -17L5 -15',
  chairHands: SEAT + 'M-13 -15L-3 -18L7 -15'
};
const STYLE = {
  none: () => ({}),
  afro: hx => ({ a: [hx, -27.5, 6.6] }),
  bun: hx => ({ a: [hx, -32, 2.6] }),
  pony: hx => ({ x: `M${hx - 3} -29q-6 1 -5 9` }),
  long: hx => ({ x: `M${hx - 4.6} -27q-2 6 -.6 10M${hx + 4.6} -27q2 6 .6 10` }),
  scarf: hx => ({ x: `M${hx - 5.2} -25a5.2 5.2 0 0 1 10.4 0c0 4 1.5 6 3 7.5M${hx - 5.2} -25c0 4 -1.5 6 -3 7.5` })
};
const DRESS = 'M0 -20L-6 -8H6Z';
const PROP = { clipboard: 'M5 -20h8v11h-8zM7.5 -20v-1.6h3v1.6M7 -16h4M7 -13h4', chart: 'M5 -22h11v12h-11zM7 -13l7 -6', cane: 'M7 -13L15 0' };

class Component extends DCLogic {
  state = { w: 1100 };
  wrapRef = React.createRef();
  componentDidMount() {
    const el = this.wrapRef.current; if (!el) return;
    const measure = () => { const w = Math.round(el.getBoundingClientRect().width); if (w && w !== this.state.w) this.setState({ w }); };
    measure();
    if (window.ResizeObserver) { this.ro = new ResizeObserver(measure); this.ro.observe(el); }
  }
  componentWillUnmount() { this.ro && this.ro.disconnect(); }
  renderVals() {
    const { w } = this.state;
    // The lab's line starts higher and rises gently; yours starts lower; the shared line is the steepest.
    // Figures are drawn larger on wide screens, with more room between the two starting lines.
    const wide = w > 620, S = wide ? 1.5 : 1, h = wide ? 240 : 220;
    const a0 = wide ? 150 : 132, b0 = wide ? 214 : 196, mx = Math.round(w * 0.45), my = wide ? 128 : 116, y1 = wide ? 20 : 14;
    const onA = x => a0 + (my - a0) * x / mx, onB = x => b0 + (my - b0) * x / mx, onT = x => my + (y1 - my) * (x - mx) / (w - mx);
    const fig = (x, y, pose, i, o = {}) => {
      const hx = pose.indexOf('chair') === 0 ? -3 : 0;
      const st = (STYLE[o.style] || STYLE.none)(hx), a = st.a || [0, 0, 0];
      const extra = [st.x, o.dress ? DRESS : '', o.prop ? PROP[o.prop] : ''].filter(Boolean).join('');
      return { tf: `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${o.flip ? -S : S} ${S})`, d: POSE[pose], x: extra || 'M0 0', hx, ax: a[0], ay: a[1], ar: a[2], c: i % 2 ? NAVY : INK };
    };
    const xa = Math.max(w * 0.2, 96), xb = Math.max(w * 0.08, 54);
    const figs = [
      fig(xa, onA(xa), 'hold', 1, { style: 'bun', dress: true, prop: 'clipboard' }),   // the lab
      fig(xb, onB(xb), 'walk', 0, { style: 'pony' }),                                  // you
      fig(mx - 10 * S, onA(mx - 10 * S), 'reach', 1, { style: 'afro' }),                       // meeting
      fig(mx + 10 * S, onT(mx + 10 * S), 'reach', 0, { style: 'scarf', dress: true, flip: true })
    ];
    if (wide) figs.push(fig(w * 0.31, onA(w * 0.31), 'chairHold', 1, { style: 'long', prop: 'chart' }));
    // Together: hand in hand up the steeper line, with someone pointing the way.
    const g = w * (wide ? 0.7 : 0.68);
    const group = wide ? [['hands', { style: 'long', dress: true }], ['chairHands', { style: 'bun' }], ['hands', { style: 'afro' }], ['hands', { prop: 'cane' }]] : [['hands', { style: 'long', dress: true }], ['hands', { style: 'afro' }]];
    group.forEach(([pose, o], i) => { const x = g + (i - (group.length - 1) / 2) * 20 * S; figs.push(fig(x, onT(x), pose, i, o)); });
    if (w > 420) figs.push(fig(w * 0.9, onT(w * 0.9), 'point', 1, { style: 'pony' }));
    const tx = mx + Math.max(28, w * 0.04);
    return { wrapRef: this.wrapRef, w, h, a0, b0, mx, my, y1, figs, labA: a0 - 12, labB: b0 + 18, labTx: tx, labTy: +(onT(tx) + 30).toFixed(1) };
  }
}
</script>
</body>
</html>
